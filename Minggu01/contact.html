<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Profil - Contact</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="portfolio.html">Portfolio</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section>
            <h2 style="margin-bottom: 10px;">Hubungi Saya</h2>
            <p style="margin-bottom: 20px;">Silakan isi formulir di bawah ini jika ada pertanyaan atau tawaran kolaborasi proyek.</p>
            
            <form action="#" method="POST" class="contact-form">
                <div class="form-group">
                    <label for="nama">Nama Lengkap:</label>
                    <input type="text" id="nama" name="nama" placeholder="Masukkan nama Anda" required>
                </div>

                <div class="form-group">
                    <label for="email">Alamat Email:</label>
                    <input type="email" id="email" name="email" placeholder="contoh@email.com" required>
                </div>

                <div class="form-group">
                    <label for="kategori">Kategori Keperluan:</label>
                    <select id="kategori" name="kategori" required>
                        <option value="">-- Pilih Kategori --</option>
                        <option value="Konsultasi">Konsultasi</option>
                        <option value="Kolaborasi">Kolaborasi Proyek</option>
                        <option value="Pertanyaan">Pertanyaan Umum</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="pesan">Pesan:</label>
                    <textarea id="pesan" name="pesan" rows="5" placeholder="Tuliskan pesan Anda di sini..." required></textarea>
                </div>

                <button type="submit">Kirim Pesan</button>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Tugas Praktikum Lab Minggu 1 - HTML & CSS</p>
    </footer>
</body>
</html>
