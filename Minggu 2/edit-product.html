<main class="flex-1 p-6 overflow-y-auto">
            <h1 class="text-2xl font-bold mb-6">Edit Produk</h1>
            
            <form action="products.html" class="bg-white p-6 rounded shadow max-w-2xl border border-gray-200">
                <div class="mb-4">
                    <label class="block text-gray-700 font-bold mb-2">Name</label>
                    <!-- Tambahkan atribut value -->
                    <input type="text" class="w-full border border-gray-300 p-2 rounded focus:outline-none focus:border-blue-500" value="Laptop ASUS ROG" required>
                </div>
                <div class="mb-4">
                    <label class="block text-gray-700 font-bold mb-2">Stock</label>
                    <!-- Tambahkan atribut value -->
                    <input type="number" class="w-full border border-gray-300 p-2 rounded focus:outline-none focus:border-blue-500" value="15" required>
                </div>
                <div class="mb-6">
                    <label class="block text-gray-700 font-bold mb-2">Description</label>
                    <!-- Isi textarea diletakkan di antara tag pembuka dan penutup -->
                    <textarea class="w-full border border-gray-300 p-2 rounded focus:outline-none focus:border-blue-500 h-24" required>Laptop gaming dengan spesifikasi tinggi.</textarea>
                </div>
                <button type="submit" class="bg-blue-600 text-white px-6 py-2 rounded hover:bg-blue-700 font-bold">Update Produk</button>
            </form>
        </main>
