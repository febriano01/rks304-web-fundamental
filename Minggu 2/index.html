<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center h-screen">
    <div class="bg-white p-8 rounded shadow-md w-96">
        <h2 class="text-2xl font-bold mb-6 text-center text-gray-800">Admin Login</h2>
        <!-- Diarahkan ke dashboard.html setelah login -->
        <form action="dashboard.html">
            <div class="mb-4">
                <label class="block text-sm font-bold mb-2 text-gray-700">Username</label>
                <input type="text" class="w-full border border-gray-300 p-2 rounded focus:outline-none focus:border-blue-500" required>
            </div>
            <div class="mb-6">
                <label class="block text-sm font-bold mb-2 text-gray-700">Password</label>
                <input type="password" class="w-full border border-gray-300 p-2 rounded focus:outline-none focus:border-blue-500" required>
            </div>
            <button type="submit" class="w-full bg-blue-600 text-white p-2 rounded hover:bg-blue-700 font-bold">Login</button>
        </form>
    </div>
</body>
</html>
