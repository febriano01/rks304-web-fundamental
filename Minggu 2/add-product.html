<main class="flex-1 p-6 overflow-y-auto">
            <h1 class="text-2xl font-bold mb-6">Add Produk</h1>
            
            <form action="products.html" class="bg-white p-6 rounded shadow max-w-2xl border border-gray-200">
                <div class="mb-4">
                    <label class="block text-gray-700 font-bold mb-2">Name</label>
                    <input type="text" class="w-full border border-gray-300 p-2 rounded focus:outline-none focus:border-blue-500" placeholder="Masukkan nama produk" required>
                </div>
                <div class="mb-4">
                    <label class="block text-gray-700 font-bold mb-2">Stock</label>
                    <input type="number" class="w-full border border-gray-300 p-2 rounded focus:outline-none focus:border-blue-500" placeholder="0" required>
                </div>
                <div class="mb-6">
                    <label class="block text-gray-700 font-bold mb-2">Description</label>
                    <textarea class="w-full border border-gray-300 p-2 rounded focus:outline-none focus:border-blue-500 h-24" placeholder="Deskripsi produk..." required></textarea>
                </div>
                <button type="submit" class="bg-green-600 text-white px-6 py-2 rounded hover:bg-green-700 font-bold">Submit</button>
            </form>
        </main>
