<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Dashboard</title>
    <!-- Ini adalah link yang membuat CSS Tailwind berfungsi -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex h-screen overflow-hidden text-gray-800">
    <!-- Sidebar / Navigasi -->
    <aside class="w-64 bg-gray-900 text-white flex flex-col">
        <div class="p-5 text-xl font-bold border-b border-gray-700">Admin Panel</div>
        <nav class="flex-1 p-4 space-y-2">
            <a href="dashboard.html" class="block p-2 hover:bg-gray-700 rounded transition">Dashboard</a>
            <a href="products.html" class="block p-2 hover:bg-gray-700 rounded transition">Products</a>
            <a href="#" class="block p-2 hover:bg-gray-700 rounded transition">Users</a>
            <a href="#" class="block p-2 hover:bg-gray-700 rounded transition">Setting</a>
        </nav>
        <div class="p-4 border-t border-gray-700">
            <a href="index.html" class="block p-2 bg-red-600 hover:bg-red-700 rounded text-center transition font-bold">Logout</a>
        </div>
    </aside>
    
    <!-- Main Content Area -->
    <div class="flex-1 flex flex-col h-screen">
        <!-- Header -->
        <header class="bg-white shadow p-4 flex justify-between items-center z-10">
            <h2 class="text-xl font-semibold">Header Page</h2>
            <div class="font-medium text-gray-600">Admin User</div>
        </header>
        
        <!-- Konten Utama (Dashboard) -->
        <main class="flex-1 p-6 overflow-y-auto">
            <h1 class="text-2xl font-bold mb-6">Dashboard E-Commerce</h1>
            <div class="grid grid-cols-1 md:grid-cols-4 gap-6">
                <!-- Card 1 -->
                <div class="bg-white p-6 rounded shadow border-l-4 border-blue-500">
                    <h3 class="text-gray-500 text-sm font-bold uppercase">Total Penjualan</h3>
                    <p class="text-3xl font-bold text-gray-800 mt-2">Rp 45.000.000</p>
                </div>
                <!-- Card 2 -->
                <div class="bg-white p-6 rounded shadow border-l-4 border-green-500">
                    <h3 class="text-gray-500 text-sm font-bold uppercase">Pesanan Baru</h3>
                    <p class="text-3xl font-bold text-gray-800 mt-2">124</p>
                </div>
                <!-- Card 3 -->
                <div class="bg-white p-6 rounded shadow border-l-4 border-yellow-500">
                    <h3 class="text-gray-500 text-sm font-bold uppercase">Total Produk</h3>
                    <p class="text-3xl font-bold text-gray-800 mt-2">850</p>
                </div>
                <!-- Card 4 -->
                <div class="bg-white p-6 rounded shadow border-l-4 border-red-500">
                    <h3 class="text-gray-500 text-sm font-bold uppercase">Pelanggan Aktif</h3>
                    <p class="text-3xl font-bold text-gray-800 mt-2">3.200</p>
                </div>
            </div>
        </main>
        
        <!-- Footer -->
        <footer class="bg-white p-4 text-center border-t text-sm text-gray-500">
            &copy; 2026 E-Commerce Admin Template.
        </footer>
    </div>
</body>
</html>
